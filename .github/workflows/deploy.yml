name: Deploy admin panel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CI_SMTP_HOST: ${{ secrets.CI_SMTP_HOST || secrets.SQUARE_MAIL_HOST }}
      CI_SMTP_PORT: ${{ secrets.CI_SMTP_PORT || secrets.SMTP_SSL_PORT || '465' }}
      CI_SMTP_USER: ${{ secrets.CI_SMTP_USER || secrets.SQUARE_MAILBOX_USER }}
      CI_SMTP_FROM: ${{ secrets.CI_SMTP_FROM || 'ci@squareexp.com' }}
      CI_SMTP_PASS: ${{ secrets.CI_SMTP_PASS || secrets.SQUARE_MAIL_PASSWORD }}
      CI_NOTIFY_EMAILS: ${{ secrets.CI_NOTIFY_EMAILS || secrets.SQUARE_MAIL_FROM }}
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          SUDO_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          envs: SUDO_PASSWORD
          request_pty: true
          command_timeout: 30m
          script: |
            set -euxo pipefail

            run_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
              fi
            }

            if ! command -v bun >/dev/null 2>&1; then
              curl -fsSL https://bun.sh/install | bash
            fi
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"

            if ! command -v pm2 >/dev/null 2>&1; then
              bun add -g pm2
            fi

            cd ~/sq/square/apps/admin
            git config --global --add safe.directory '*' || true
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' chown -R $(whoami):$(whoami) ~/sq/square/apps/admin || true
            git fetch --all --prune
            git reset --hard origin/main

            bun install
            npm run build

            pm2 delete iam-admin >/dev/null 2>&1 || true
            pm2 start "bun run start -- -p 2020 -H 127.0.0.1" --name iam-admin
            pm2 save

            cat >/tmp/iam.squareexp.com.conf <<'EON'
            server {
              listen 80;
              server_name iam.squareexp.com;

              location / {
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_pass http://127.0.0.1:2020;
              }
            }
            EON

            run_root mv /tmp/iam.squareexp.com.conf /etc/nginx/sites-available/iam.squareexp.com.conf
            run_root ln -sf /etc/nginx/sites-available/iam.squareexp.com.conf /etc/nginx/sites-enabled/iam.squareexp.com.conf
            run_root nginx -t
            run_root systemctl reload nginx

      - name: Generate styled HTML email
        if: always()
        run: |
          cat << 'EOF' > generate-email.js
          const fs = require('fs');
          const { execSync } = require('child_process');

          try {
            const repo = process.env.GITHUB_REPOSITORY || 'unknown';
            const branch = process.env.GITHUB_REF_NAME || 'unknown';
            const actor = process.env.GITHUB_ACTOR || 'unknown';
            const runId = process.env.GITHUB_RUN_ID || '';
            const status = process.argv[2] || 'success';
            
            let commitSha = 'unknown';
            let commitMsg = 'No commit message';
            try {
              commitSha = execSync('git rev-parse --short HEAD').toString().trim();
              commitMsg = execSync('git log -1 --pretty=%B').toString().trim().split('\n')[0].replace(/"/g, '\\"');
            } catch (err) {}
            
            let commitsHtml = '';
            try {
              const commitsRaw = execSync('git log -n 5 --pretty=format:"%h|%an|%s"').toString().trim();
              commitsHtml = commitsRaw.split('\n').map(line => {
                const parts = line.split('|');
                const h = parts[0];
                const author = parts[1];
                const subject = parts.slice(2).join('|');
                return `<li style="margin-bottom: 8px; font-family: monospace; font-size: 13px; color: #4B5563;"><span style="color: #2563EB; font-weight: bold;">${h}</span>: ${subject} <span style="color: #9CA3AF; font-size: 11px;">(${author})</span></li>`;
              }).join('\n');
            } catch (err) {
              commitsHtml = `<li style="color: #9CA3AF;">No recent commit history found</li>`;
            }

            const runUrl = runId ? `https://github.com/${repo}/actions/runs/${runId}` : '#';
            
            let statusBg = '#D1FAE5';
            let statusColor = '#065F46';
            let statusText = 'Success';
            let statusTitle = 'Succeeded';
            let btnBg = '#10B981';
            
            if (status === 'failure') {
              statusBg = '#FEE2E2';
              statusColor = '#991B1B';
              statusText = 'Failed';
              statusTitle = 'Failed';
              btnBg = '#EF4444';
            } else if (status === 'cancelled') {
              statusBg = '#F3F4F6';
              statusColor = '#374151';
              statusText = 'Cancelled';
              statusTitle = 'Cancelled';
              btnBg = '#6B7280';
            }

            const html = `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Deploy ${statusTitle}</title>
          </head>
          <body style="margin: 0; padding: 0; background-color: #F9FAFB; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased;">
            <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F9FAFB; padding: 40px 20px;">
              <tr>
                <td align="center">
                  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 540px; background-color: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);">
                    <tr>
                      <td style="padding: 32px 32px 24px 32px; border-bottom: 1px solid #F3F4F6;">
                        <img src="https://squarexc.s3.eu-north-1.amazonaws.com/logo.svg" alt="Square Logo" height="28" style="display: block; border: 0; outline: none; text-decoration: none;">
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 32px 32px 0 32px;">
                        <span style="display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; background-color: ${statusBg}; color: ${statusColor}; margin-bottom: 16px;">
                          ${statusText}
                        </span>
                        <h1 style="margin: 0; font-size: 24px; font-weight: 700; color: #111827; line-height: 1.25;">
                          Deploy ${statusTitle}
                        </h1>
                        <p style="margin: 8px 0 0 0; font-size: 15px; color: #4B5563; line-height: 1.5;">
                          The workflow execution for <strong>${repo}</strong> has finished.
                        </p>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 24px 32px;">
                        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #F9FAFB; border-radius: 8px; padding: 16px;">
                          <tr>
                            <td width="35%" style="padding: 6px 0; font-size: 13px; font-weight: 600; color: #374151; vertical-align: top;">Repository</td>
                            <td style="padding: 6px 0; font-size: 13px; color: #4B5563; vertical-align: top; font-family: monospace;">${repo}</td>
                          </tr>
                          <tr>
                            <td style="padding: 6px 0; font-size: 13px; font-weight: 600; color: #374151; vertical-align: top;">Branch / Ref</td>
                            <td style="padding: 6px 0; font-size: 13px; color: #4B5563; vertical-align: top; font-family: monospace;">${branch}</td>
                          </tr>
                          <tr>
                            <td style="padding: 6px 0; font-size: 13px; font-weight: 600; color: #374151; vertical-align: top;">Commit</td>
                            <td style="padding: 6px 0; font-size: 13px; color: #4B5563; vertical-align: top;">
                              <span style="font-family: monospace; font-weight: bold; color: #2563EB;">${commitSha}</span>
                              <div style="margin-top: 4px; font-size: 12px; color: #6B7280; line-height: 1.4;">"${commitMsg}"</div>
                            </td>
                          </tr>
                          <tr>
                            <td style="padding: 6px 0; font-size: 13px; font-weight: 600; color: #374151; vertical-align: top;">Triggered By</td>
                            <td style="padding: 6px 0; font-size: 13px; color: #4B5563; vertical-align: top;">${actor}</td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 0 32px 24px 32px;">
                        <h3 style="margin: 0 0 12px 0; font-size: 14px; font-weight: 600; color: #374151; text-transform: uppercase; letter-spacing: 0.05em;">Recent Changes</h3>
                        <ul style="margin: 0; padding-left: 20px; font-size: 14px; color: #4B5563; line-height: 1.6;">
                          ${commitsHtml}
                        </ul>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 0 32px 32px 32px; border-bottom: 1px solid #F3F4F6;">
                        <a href="${runUrl}" target="_blank" style="display: inline-block; background-color: ${btnBg}; color: #FFFFFF; padding: 12px 24px; border-radius: 6px; font-size: 14px; font-weight: 600; text-decoration: none; text-align: center;">
                          View Workflow Run
                        </a>
                      </td>
                    </tr>
                    <tr>
                      <td style="padding: 24px 32px; background-color: #FAFAFA; text-align: center;">
                        <p style="margin: 0; font-size: 12px; color: #9CA3AF; line-height: 1.5;">
                          This email was sent automatically by the Square Experience CI pipeline.<br>
                          Please do not reply directly to this message.
                        </p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </body>
          </html>`;
            fs.writeFileSync('email.html', html);
          } catch (e) {
            console.error(e);
            process.exit(1);
          }
          EOF
          node generate-email.js "${{ job.status }}"

      - name: Send notification email
        if: always()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.CI_SMTP_HOST }}
          server_port: ${{ env.CI_SMTP_PORT }}
          username: ${{ env.CI_SMTP_USER }}
          password: ${{ env.CI_SMTP_PASS }}
          secure: true
          subject: "[${{ github.repository }}] Deploy ${{ job.status }}: ${{ github.ref_name }}"
          to: ${{ env.CI_NOTIFY_EMAILS }}
          from: ${{ env.CI_SMTP_FROM }}
          html_body: file://email.html
